server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 纯静态应用：资源按哈希命名，可用长缓存；HTML 不缓存以便更新。
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查端点：存在即说明静态应用已正确部署。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
